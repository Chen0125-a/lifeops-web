apiVersion: v1
kind: Service
metadata:
  name: {{ include "lifeops-web.fullname" . }}-api
  labels:
    {{- include "lifeops-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.monitoring.enabled }}
    - name: metrics
      port: 9090
      targetPort: http
      protocol: TCP
    {{- end }}
  selector:
    {{- include "lifeops-web.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
