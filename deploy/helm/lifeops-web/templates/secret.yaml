{{- if and .Values.secrets.create .Values.externalSecret.enabled }}
{{- fail "secrets.create and externalSecret.enabled are mutually exclusive" }}
{{- end }}
{{- if and .Values.production .Values.secrets.create }}
{{- fail "production rendering forbids inline Secret creation; use an existing Secret or ExternalSecret" }}
{{- end }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | quote }}
  labels:
    {{- include "lifeops-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.secretKeys.adminPassword }}: {{ required "secrets.data.adminPassword is required when secrets.create=true" .Values.secrets.data.adminPassword | quote }}
  {{ include "lifeops-web.mysqlPasswordKey" . }}: {{ required "secrets.data.mysqlPassword is required when secrets.create=true" .Values.secrets.data.mysqlPassword | quote }}
  {{- if .Values.mysql.enabled }}
  {{ .Values.mysql.auth.rootPasswordKey }}: {{ required "secrets.data.mysqlRootPassword is required when secrets.create=true" .Values.secrets.data.mysqlRootPassword | quote }}
  {{- end }}
{{- end }}
