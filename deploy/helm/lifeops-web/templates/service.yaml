apiVersion: v1
kind: Service
metadata:
  name: {{ include "lifeops-web.fullname" . }}-web
  labels:
    {{- include "lifeops-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "lifeops-web.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
