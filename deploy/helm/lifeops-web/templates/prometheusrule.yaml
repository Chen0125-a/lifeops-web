{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lifeops-web.fullname" . }}
  labels:
    {{- include "lifeops-web.labels" . | nindent 4 }}
spec:
  groups:
    - name: lifeops.availability
      rules:
        - alert: LifeOpsUnavailable
          expr: min(up{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}) < 1
          for: 2m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace | quote }}
            release: {{ .Release.Name | quote }}
          annotations:
            summary: LifeOps API scrape target is unavailable
            runbook_url: docs/runbooks/observability.md
        - alert: LifeOpsHigh5xxRate
          expr: |
            sum(rate(lifeops_http_requests_total{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}",status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(lifeops_http_requests_total{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m])), 1)
            > 0.05
          for: 10m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace | quote }}
            release: {{ .Release.Name | quote }}
          annotations:
            summary: LifeOps API 5xx ratio is above five percent
            runbook_url: docs/runbooks/observability.md
        - alert: LifeOpsHighP95Latency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(lifeops_http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}",release="{{ .Release.Name }}"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace | quote }}
            release: {{ .Release.Name | quote }}
          annotations:
            summary: LifeOps API p95 request duration is above one second
            runbook_url: docs/runbooks/observability.md
        - alert: LifeOpsPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"{{ include "lifeops-web.fullname" . }}-.*"}[10m]) > 0
          for: 10m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace | quote }}
            release: {{ .Release.Name | quote }}
          annotations:
            summary: A LifeOps container is repeatedly restarting
            runbook_url: docs/runbooks/observability.md
        - alert: LifeOpsReadinessFailing
          expr: max by (pod) (kube_pod_status_ready{namespace="{{ .Release.Namespace }}",pod=~"{{ include "lifeops-web.fullname" . }}-.*",condition="true"}) < 1
          for: 5m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace | quote }}
            release: {{ .Release.Name | quote }}
          annotations:
            summary: A LifeOps pod has remained unready
            runbook_url: docs/runbooks/observability.md
{{- end }}
