{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lifeops-web.fullname" . }}-credentials
  labels:
    {{- include "lifeops-web.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.api.secretKeys.adminPassword }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.adminPassword is required" .Values.externalSecret.remoteRefs.adminPassword }}
    - secretKey: {{ include "lifeops-web.mysqlPasswordKey" . }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.mysqlPassword is required" .Values.externalSecret.remoteRefs.mysqlPassword }}
    {{- if .Values.mysql.enabled }}
    - secretKey: {{ .Values.mysql.auth.rootPasswordKey }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.mysqlRootPassword is required" .Values.externalSecret.remoteRefs.mysqlRootPassword }}
    {{- end }}
    {{- if eq .Values.media.backend "s3" }}
    - secretKey: {{ .Values.media.s3.accessKeyIdKey }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.s3AccessKeyId is required for S3 media storage" .Values.externalSecret.remoteRefs.s3AccessKeyId }}
    - secretKey: {{ .Values.media.s3.secretAccessKeyKey }}
      remoteRef:
        key: {{ required "externalSecret.remoteRefs.s3SecretAccessKey is required for S3 media storage" .Values.externalSecret.remoteRefs.s3SecretAccessKey }}
    {{- end }}
{{- end }}
