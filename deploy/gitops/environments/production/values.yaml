production: true

web:
  image:
    repository: uhub.service.ucloud.cn/chenucloud/lifeops-web
    tag: "1.0.0"
    digest: "sha256:31d13ed140d0f3343bbef40355e736ce8d63298ffa3c3efb97f27659fb9fa4af"

api:
  image:
    repository: uhub.service.ucloud.cn/chenucloud/lifeops-api
    tag: "1.0.0"
    digest: "sha256:c70d0b33612e36c171c4085639e8cf7d558abdbd37b780fb0bd651a4e7c9c5e3"
  config:
    allowedOrigins: "https://lifeops.chenspace.com"

media:
  backend: filesystem
  filesystem:
    root: /var/lib/lifeops/media
    persistence:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteMany

mysql:
  persistence:
    storageClass: ""

platform:
  kubernetes:
    enabled: false
    baseUrl: https://kubernetes.default.svc
    deepLinkUrl: ""
  integrations:
    prometheus:
      enabled: false
      baseUrl: ""
      deepLinkUrl: ""
    alertmanager:
      enabled: false
      baseUrl: ""
      deepLinkUrl: ""
    elasticsearch:
      enabled: false
      baseUrl: ""
      deepLinkUrl: ""
    github:
      enabled: false
      baseUrl: ""
      deepLinkUrl: ""
    argoCd:
      enabled: false
      baseUrl: ""
      deepLinkUrl: ""

httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - lifeops.chenspace.com

monitoring:
  enabled: true
  serviceMonitor:
    interval: 30s
  grafana:
    sidecarLabel: grafana_dashboard
    sidecarLabelValue: "1"

networkPolicy:
  enabled: true
  allowInternetEgress: false
  gateway:
    namespace: envoy-gateway-system
  prometheus:
    namespace: monitoring
    podLabels:
      app.kubernetes.io/name: prometheus
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  integrationEgress: []
